artifact_store: hybrid

project:
  name: microreserva
  local_name: Nuevo
  detected_at: "2026-04-06"

detected_context: |
  Source: engram topic_key "sdd-init/Nuevo" (observation #1)

  - Tech stack:
    - Frontend: React + TypeScript (Vite)
    - Backend: Netlify Functions (Node, TypeScript) in netlify/functions/*.ts
    - Database: PostgreSQL (Neon) via @neondatabase/serverless
    - Tooling: npm, vite, TypeScript, netlify-cli

  - Architecture patterns:
    - Serverless backend with Netlify Functions; backend contains business rules and auth (Basic + bcrypt)
    - Frontend communicates with functions proxied at /.netlify/functions/* (Netlify Dev) and via API client in src/services/api.ts
    - SQL queries executed directly in functions; tables: bookings, admin_settings
    - Booking id composition and upsert rules live in backend (bookings.ts)

  - Existing conventions and docs:
    - AGENTS.md and README.md provide developer runbook and env requirements
    - Environment variables required: DATABASE_URL, ADMIN_USERS (JSON), ALLOWED_ORIGIN
    - Admin auth: Basic auth validated via bcrypt hashes stored in ADMIN_USERS
    - Conventional commits; no AI attribution in commits

  - Testing & CI:
    - No explicit test runner discovered in package.json scripts or test files (prior to this bootstrap)
    - No CI configs (github/workflows) detected

  - Style & quality tools:
    - TypeScript present (tsconfig.json)
    - No explicit linter (eslint) or formatter (prettier) configs found

testing:
  strict_tdd: false
  capabilities:
    runner: vitest
    default_environment: jsdom
    node_test_support: true
    node_test_switch_strategy: "Use @vitest-environment node file header OR netlify/functions/**/*.test.ts path"
    include_patterns:
      - src/**/*.test.ts
      - src/**/*.test.tsx
  baseline_added:
    - package.json scripts: test, test:watch
    - devDependencies: vitest, @testing-library/react, jsdom
    - vitest.config.ts created

next_steps:
  - Run npm install to materialize new test dependencies.
  - Run npm test to verify baseline test execution.
  - Add first component test and one Netlify function test using node environment.
  - Consider adding CI workflow for test execution on pull requests.
